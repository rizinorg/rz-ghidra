name: Distribution
on:
  push:
    branches:

jobs:
  tarball:
    name: Create source tarball
    if: startsWith(github.ref, 'refs/tags/deploy-test-') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Checkout submodules
        run: |
            git submodule init
            git submodule update
      - name: Create tarball
        shell: bash
        run: |
            find . -name ".git*" | xargs rm -rfv
            shopt -s extglob
            mkdir rz-ghidra
            mv !(rz-ghidra) rz-ghidra
            tar -czvf rz-ghidra-src.tar.gz rz-ghidra
      - uses: actions/upload-artifact@v2
        with:
          name: rz-ghidra-src.tar.gz
          path: rz-ghidra-src.tar.gz

  create-release:
    name: Create draft release and upload artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/deploy-test-') || startsWith(github.ref, 'refs/tags/v'))
    needs: [
      tarball
    ]
    steps:
    - uses: actions/checkout@v3
    - name: Extract version
      id: extract_version
      run: echo "version=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
    - uses: actions/download-artifact@v3
    - name: Display structure of downloaded files
      run: ls -R
    - name: Rename asset
      run: mv ./rz-ghidra-src.tar.gz/rz-ghidra-src.tar.gz ./rz-ghidra-src-${{ steps.extract_version.outputs.version }}.tar.gz
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2
      with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.extract_version.outputs.version }}
          draft: true
          prerelease: false
          files: ./rz-ghidra-src-${{ steps.extract_version.outputs.version }}.tar.gz
